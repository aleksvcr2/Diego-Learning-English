<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Responde al DOT en inglés sin miedo | The Mendoza Law Firm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --navy:#0F2A4A; --navy-2:#16406F; --green:#158A4A; --green-bg:#E7F6ED;
  --orange:#F1631B; --orange-2:#D65210; --red:#DC2A2A; --red-bg:#FCE9E9;
  --ink:#141B22; --paper:#FFFFFF; --mist:#F4F6F8; --line:#E4E8EC;
}
html.dark{
  --paper:#0D1420; --mist:#141C29; --ink:#EAF0F6; --line:#25313F;
  --green-bg:#0F2A20; --red-bg:#2A1414;
}
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--mist);color:var(--ink);margin:0;
  padding-bottom:76px; -webkit-tap-highlight-color:transparent;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;
  border-radius:14px;padding:.85rem 1.4rem;font-size:.95rem;transition:transform .15s ease,filter .15s ease;
  border:none;cursor:pointer;}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{filter:brightness(1.06)}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{filter:brightness(1.15)}
.btn-outline{background:transparent;border:2px solid var(--navy);color:var(--navy);}
html.dark .btn-outline{color:#EAF0F6;border-color:#3A4B5E}
.btn-ghost{background:var(--mist);color:var(--ink);}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:.5rem .9rem;font-size:.8rem;border-radius:10px;}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;
  padding:.28rem .65rem;border-radius:999px;letter-spacing:.01em;}
.badge-navy{background:#E7EEF6;color:var(--navy)} html.dark .badge-navy{background:#182A3E;color:#9FC1E6}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-orange{background:#FEEBE0;color:var(--orange-2)} html.dark .badge-orange{background:#3A2013;color:#FFA36B}
.badge-red{background:var(--red-bg);color:var(--red)}
.input{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;
  padding:.75rem .9rem;font-size:.95rem;color:var(--ink);outline:none;}
.input:focus{border-color:var(--navy)}
.navlink{font-weight:600;font-size:.9rem;color:var(--ink);opacity:.75;padding:.5rem .3rem;border-bottom:2px solid transparent;}
.navlink.active,.navlink:hover{opacity:1;border-color:var(--orange);color:var(--navy)}
html.dark .navlink.active,html.dark .navlink:hover{color:#fff}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);
  display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.6rem 0 .5rem;
  font-size:.65rem;font-weight:600;color:#8996A3;background:none;border:none;}
.bottomnav button.active{color:var(--orange)}
.mic-btn{width:104px;height:104px;border-radius:999px;background:var(--orange);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(241,99,27,.35);cursor:pointer;}
.mic-btn.listening{animation:pulse 1.4s ease-in-out infinite;background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,42,42,.45)}70%{box-shadow:0 0 0 26px rgba(220,42,42,0)}100%{box-shadow:0 0 0 0 rgba(220,42,42,0)}}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:.4rem .9rem;font-size:.82rem;font-weight:600;
  background:var(--paper);cursor:pointer;color:var(--ink);}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:12px;font-size:.85rem;font-weight:600;
  box-shadow:0 8px 20px rgba(0,0,0,.2);animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.scorebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.scorebar>div{height:100%;background:var(--green)}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.fade-in{animation:fadein .25s ease}
@media(min-width:900px){.bottomnav{display:none}body{padding-bottom:0}}
</style>
</head>
<body>
<div id="toastWrap" class="toast-wrap"></div>
<div id="topnav"></div>
<div id="app" class="fade-in"></div>
<div id="bottomnav"></div>

<script>
/* ============================= DATOS DE DEMOSTRACIÓN ============================= */

const MODULES = [

const HONEST_PHRASES = [
  {en:"I'm not sure. May I verify that information?", es:"No estoy seguro. ¿Puedo verificar esa información?"},
  {en:"I don't know the answer, officer.", es:"No sé la respuesta, oficial."},

  {en:"Could you please explain what you mean?", es:"¿Podría explicar a qué se refiere?"},

function q(en, es, keywords, tip, error){ return {en, es, keywords, tip, error}; }

const SCENARIOS = [
  {id:'dot-1', category:'dot', level:'A2-B1', title:'Inspección DOT de Nivel I', character:'Oficial DOT', location:'Carretera interestatal',
    objective:'Responder con claridad y profesionalismo durante una inspección completa.',
    opening:"Good morning, driver. Please pull over safely and turn off the engine.",
    keyVocab:["driver's license","medical certificate","registration","insurance","bill of lading","hours of service","electronic logging device","pre-trip inspection"],
    questions:[
      q("Good morning, driver. May I see your driver's license, please?","Buenos días, ¿me muestra su licencia de conducir?",["license","here","officer","yes"],"Yes, officer. Here is my license.","Olvidar decir 'officer' o entregar el documento equivocado."),
      q("Can I also see your medical certificate?","¿Puede mostrar su certificado médico?",["medical","certificate","here"],"Yes, sir. Here is my medical certificate.","Confundir 'medical certificate' con 'medical insurance'."),
      q("I need your vehicle registration as well.","Necesito el registro del vehículo.",["registration","here"],"Of course. Here is the registration.","No tener el documento a la mano rápidamente."),
      q("Do you have proof of insurance?","¿Tiene comprobante de seguro?",["insurance","yes","have"],"Yes, I have it right here.","Decir 'ensurance' en vez de 'insurance'."),
      q("What are you hauling today, and where is the bill of lading?","¿Qué está transportando hoy y dónde está el Bill of Lading?",["hauling","bill of lading","cargo"],"I'm hauling general freight. Here's the bill of lading.","No saber describir la carga en inglés."),
      q("Where did you load, and what is your destination?","¿Dónde cargó y cuál es su destino?",["from","to","destination","origin"],"I loaded in Dallas, Texas, and my destination is Atlanta, Georgia.","Confundir origen y destino."),
      q("How many hours have you driven today?","¿Cuántas horas ha manejado hoy?",["hours","drove","driven"],"I've driven about five hours today.","No saber calcular ni expresar las horas en inglés."),
      q("Can you show me your Electronic Logging Device?","¿Puede mostrarme su Electronic Logging Device?",["eld","log","here","device"],"Yes, here is my ELD. My logs are current.","No saber cómo mostrar el registro del ELD."),
      q("Did you complete your pre-trip inspection today?","¿Realizó su inspección previa al viaje hoy?",["yes","pre-trip","inspection","completed"],"Yes, officer, I completed my pre-trip inspection this morning.","Responder 'no' sin explicar el motivo."),
      q("Have you noticed any mechanical problems with the truck or trailer?","¿Ha notado algún problema mecánico?",["no","problem","brakes","lights"],"No, everything is working properly.","No reportar un problema real por miedo a decir 'no sé'."),
      q("I'm going to walk around your vehicle now. Please stay here.","Voy a revisar su vehículo. Espere aquí.",["okay","understood","yes"],"Okay, officer, I'll wait right here.","Seguir al oficial sin que se lo pidan."),
      q("Everything looks good. Here are your documents back. Drive safe.","Todo está en orden. Aquí tiene sus documentos. Maneje con cuidado.",["thank you","have a good day"],"Thank you, officer. Have a good day.","No agradecer o despedirse de forma profesional."),
    ]},
  {id:'dot-2', category:'dot', level:'A1-A2', title:'Parada por una luz defectuosa', character:'State Trooper', location:'Carretera nocturna',
    objective:'Entender el motivo de la parada y responder con calma.',
    opening:"Good evening. I stopped you because your right brake light is out.",
    keyVocab:['brake light','taillight','fix','warning','citation'],
    questions:[
      q("Do you know your brake light is out?","¿Sabía que su luz de freno estaba fundida?",['no','sorry','didn\'t know'],"No, I didn't know that, officer. Thank you for letting me know.","Discutir en vez de reconocer el problema."),
      q("License and registration, please.","Licencia y registro, por favor.",['here','license','registration'],"Here you go, officer.","Tardar demasiado en encontrar los documentos."),
      q("I'll give you a warning today. Please get that light fixed soon.","Le daré una advertencia. Repare esa luz pronto.",['thank you','will fix','understood'],"Thank you, officer. I'll get it fixed today.","No comprometerse a reparar el problema."),
      q("Do you have a nearby shop where you can get this fixed?","¿Tiene un taller cerca para repararlo?",['yes','shop','nearby'],"Yes, there's a shop about ten miles from here.","No saber dar direcciones o distancias."),
      q("Drive safely, and get that light checked as soon as possible.","Maneje con cuidado y revise esa luz pronto.",['thank you','will do'],"Thank you very much, officer. Have a good night.","No despedirse adecuadamente."),
      q("Do you have any other lights or equipment issues I should know about?","¿Tiene algún otro problema de luces o equipo?",['no','not that i know'],"No, not that I know of, officer.","Ocultar información sobre otros problemas."),
    ]},
  {id:'dot-3', category:'dot', level:'B1', title:'Revisión del Electronic Logging Device', character:'Oficial DOT', location:'Weigh station',
    objective:'Explicar y mostrar correctamente el ELD.',

    questions:[
      q("Please show me your ELD screen.","Muéstreme la pantalla de su ELD.",['here','screen','eld'],"Here is my ELD, officer.","Bloquear la pantalla del dispositivo por accidente."),
      q("What is your current duty status?","¿Cuál es su estado actual de servicio?",['driving','on duty','off duty'],"I'm currently on-duty driving.","Confundir 'on-duty' con 'off-duty'."),
      q("How many driving hours do you have left today?","¿Cuántas horas de manejo le quedan hoy?",['hours','left','remaining'],"I have about three hours of driving time left.","No saber calcular las horas restantes."),
      q("Has your ELD shown any malfunction codes recently?","¿Su ELD ha mostrado códigos de mal funcionamiento?",['no','malfunction','yes'],"No, it has been working correctly.","No reportar un malfuncionamiento real."),
      q("Can you show me your logs from yesterday?","¿Puede mostrarme sus registros de ayer?",['yesterday','logs','here'],"Yes, here are yesterday's logs.","No saber navegar el historial del dispositivo."),
      q("Everything looks compliant. Thank you for your cooperation.","Todo está en orden. Gracias por su cooperación.",['thank you','welcome'],"Thank you, officer.","Olvidar agradecer al finalizar."),
    ]},
  {id:'scale-1', category:'scales', level:'A2', title:'Entrada a una weigh station', character:'Inspector de báscula', location:'Weigh station',
    objective:'Seguir instrucciones y comprender el proceso de pesaje.',
    opening:"Pull your truck onto the scale and stay in the vehicle.",
    keyVocab:['scale','axle weight','gross weight','ticket'],
    questions:[
      q("Are you carrying any hazardous materials?","¿Transporta materiales peligrosos?",['no','yes','hazardous'],"No, I'm not carrying any hazardous materials.","No conocer el término 'hazardous materials'."),
      q("Please pull forward slowly onto the scale.","Avance despacio sobre la báscula.",['okay','understood'],"Okay, pulling forward now.","Avanzar demasiado rápido."),
      q("Your gross vehicle weight looks fine. Here is your scale ticket.","Su peso bruto está bien. Aquí tiene su ticket.",['thank you'],"Thank you very much.","No recoger el ticket antes de avanzar."),
      q("Do you know your current axle weight distribution?","¿Conoce la distribución del peso por eje?",['not sure','yes','axle'],"I'm not completely sure, but it should be within limits.","No saber explicar el concepto de axle weight."),
      q("You're clear to go. Have a safe trip.","Puede continuar. Buen viaje.",['thank you','will do'],"Thank you, I will. Have a good day.","No responder y simplemente arrancar."),
    ]},
  {id:'scale-2', category:'scales', level:'B1', title:'Camión con sobrepeso', character:'Inspector de báscula', location:'Weigh station',
    objective:'Entender una violación de peso y las opciones disponibles.',

    questions:[
      q("Do you understand why I asked you to pull over?","¿Entiende por qué le pedí que se detenga?",['yes','overweight','understand'],"Yes, sir. My drive axle is overweight.","No comprender el motivo de la parada."),
      q("Do you have an overweight permit for this load?","¿Tiene un permiso de sobrepeso para esta carga?",['no','yes','permit'],"No, I don't have one for this load.","Decir que sí sin tener el permiso realmente."),
      q("You'll need to redistribute the load or get a permit before continuing.","Debe redistribuir la carga u obtener un permiso.",['understood','okay','will do'],"I understand. I'll contact my dispatcher right away.","No mencionar que contactará a dispatch."),
      q("Can you contact your company now?","¿Puede contactar a su compañía ahora?",['yes','calling'],"Yes, I'm calling my dispatcher now.","Tardar en resolver la comunicación con dispatch."),
      q("Once it's resolved, come back through the scale.","Cuando se resuelva, regrese a la báscula.",['understood','will do'],"Understood. Thank you for your patience.","No regresar a pesar nuevamente después de resolver."),
    ]},
  {id:'mech-1', category:'mechanic', level:'A2-B1', title:'Problema con los frenos', character:'Mecánico', location:'Taller de carretera',
    objective:'Describir una falla mecánica con claridad.',
    opening:"Hi, what seems to be the problem with your truck today?",
    keyVocab:['brakes','grinding noise','pressure','warning light'],
    questions:[
      q("What seems to be the problem with your truck today?","¿Cuál parece ser el problema con su camión?",['brakes','problem','noise'],"My brakes are making a grinding noise.","No saber describir el sonido o síntoma."),
      q("When did you first notice this issue?","¿Cuándo notó el problema por primera vez?",['this morning','yesterday','today'],"I noticed it this morning on the highway.","Confundir el tiempo verbal al describir cuándo ocurrió."),
      q("Is the brake warning light on?","¿Está encendida la luz de advertencia de frenos?",['yes','no','light'],"Yes, the warning light came on about an hour ago.","No saber identificar las luces del tablero."),
      q("I'll check the air pressure and the brake pads now.","Revisaré la presión de aire y las pastillas.",['okay','thank you'],"Okay, thank you. How long will it take?","No preguntar por el tiempo estimado."),
      q("It will take about an hour. Do you want to wait here?","Tomará una hora. ¿Quiere esperar aquí?",['yes','wait','okay'],"Yes, I'll wait here. Thank you.","No decidir claramente si esperará o no."),
      q("The brake pads were worn out. They're replaced now.","Las pastillas estaban desgastadas. Ya están cambiadas.",['thank you','how much'],"Thank you very much. How much do I owe you?","No preguntar por el costo del servicio."),
    ]},
  {id:'mech-2', category:'mechanic', level:'A2', title:'Neumático dañado en carretera', character:'Asistencia en carretera', location:'Hombro de la carretera',
    objective:'Solicitar asistencia y describir la ubicación.',
    opening:"Roadside assistance, what's your emergency?",
    keyVocab:['flat tire','blowout','shoulder','mile marker','tow'],
    questions:[
      q("Roadside assistance, what's your emergency?","Asistencia en carretera, ¿cuál es su emergencia?",['flat','tire','blowout'],"I have a flat tire on my trailer.","No saber decir 'flat tire' claramente."),
      q("What is your exact location?","¿Cuál es su ubicación exacta?",['mile marker','highway','location'],"I'm on Interstate 20, near mile marker 45.","No poder describir mile marker o carretera."),
      q("Are you in a safe location off the road?","¿Está en un lugar seguro fuera de la vía?",['yes','shoulder','safe'],"Yes, I'm parked on the shoulder with my hazard lights on.","No mencionar las luces de emergencia encendidas."),
      q("A technician will arrive in about 45 minutes. Can you wait safely?","Un técnico llegará en 45 minutos. ¿Puede esperar seguro?",['yes','will wait'],"Yes, I can wait. Thank you.","No confirmar si puede esperar con seguridad."),
      q("Do you have a spare tire, or do we need to bring one?","¿Tiene una llanta de repuesto o necesitan traer una?",['no','yes','spare'],"No, I don't have a spare. Please bring one.","No saber si tiene o no repuesto disponible."),
    ]},
  {id:'dispatch-1', category:'dispatch', level:'A2-B1', title:'Llamada al dispatcher por retraso', character:'Dispatcher', location:'En ruta',
    objective:'Explicar un retraso y proponer una solución.',
    opening:"Dispatch, go ahead.",
    keyVocab:['delay','traffic','appointment','ETA','detention'],
    questions:[
      q("Dispatch, go ahead.","Adelante, dispatch escucha.",['delay','traffic','running late'],"Hi, this is truck 204. I'm running about an hour late.","No identificarse con el número de unidad."),
      q("What's causing the delay?","¿Qué está causando el retraso?",['traffic','accident','construction'],"There's heavy traffic due to an accident on the highway.","No dar una razón clara del retraso."),
      q("What's your new ETA to the delivery?","¿Cuál es su nueva hora estimada de llegada?",['eta','arrive','around'],"My new ETA is around 3 PM.","No saber expresar la hora estimada en inglés."),
      q("I'll call the receiver and update the appointment time.","Llamaré al receptor para actualizar la cita.",['thank you','okay'],"Thank you. Please let me know if anything changes.","No pedir confirmación de la actualización."),
      q("Do you have enough hours of service to complete the delivery?","¿Tiene suficientes horas de servicio para completar la entrega?",['yes','hours','enough'],"Yes, I still have enough hours today.","No verificar sus horas antes de responder."),
      q("Okay, keep me posted. Drive safe.","Está bien, mantente informado. Maneja con cuidado.",['will do','thank you'],"Will do. Thanks, dispatch.","No cerrar la llamada de forma profesional."),
    ]},
  {id:'terminal-1', category:'terminal', level:'A2', title:'Llegada a una terminal', character:'Personal de terminal', location:'Terminal de carga',

      q("Good morning. Do you have an appointment today?","Buenos días, ¿tiene cita hoy?",['yes','appointment'],"Yes, I have an appointment at 9 AM.","No traer el número de cita a la mano."),
      q("What's your pickup number or reference number?","¿Cuál es su número de recolección o referencia?",['pickup number','reference'],"My pickup number is 48213.","No saber leer números en inglés con claridad."),
      q("Please back into dock number seven.","Por favor retroceda al andén número siete.",['okay','dock seven','understood'],"Okay, backing into dock seven now.","Confundir el número de andén."),

  {id:'terminal-2', category:'terminal', level:'B1', title:'Confirmación de pickup', character:'Shipping clerk', location:'Almacén',

  {id:'terminal-3', category:'terminal', level:'B1-B2', title:'Entrega con mercancía dañada', character:'Receiving clerk', location:'Centro de distribución',

    questions:[
      q("We found some damage on a few boxes. Can you take a look?","Encontramos daño en algunas cajas. ¿Puede revisar?",['yes','sure','okay'],"Sure, let me take a look.","No revisar la carga con el receptor."),

const STORE_KEY = 'mendoza_dot_english_v1';
function defaultState(){
  return {
    onboarded:false, loggedIn:false,
    user:{name:'', country:'', level:'A2', years:'', opType:'OTR', difficulties:[], dailyMinutes:15, speed:'normal'},
    progress:{streak:0,lastPracticeDate:null,totalMinutes:0,sessions:[],wordsLearned:[],moduleStats:{}},
    settings:{darkMode:false, adminVocab:[], adminScenarioStatus:{}}
  };
}
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(!raw) return defaultState();
    const parsed = JSON.parse(raw); return Object.assign(defaultState(), parsed,
      {user:Object.assign(defaultState().user,parsed.user||{}),
       progress:Object.assign(defaultState().progress,parsed.progress||{}),
       settings:Object.assign(defaultState().settings,parsed.settings||{})});
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }
let STATE = loadState();
function applyDarkMode(){ document.documentElement.classList.toggle('dark', !!STATE.settings.darkMode); }
applyDarkMode();

function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  wrap.appendChild(el); setTimeout(()=>el.remove(), 3200);
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function recordSession(scenario, scores, durationMin, wordsUsed){
  const s = STATE.progress;
  s.sessions.unshift({id:'s'+Date.now(), scenarioId:scenario.id, title:scenario.title, category:scenario.category,
    date:new Date().toISOString(), scores, durationMin});
  s.totalMinutes += durationMin;
  const today = todayStr();
  if(s.lastPracticeDate !== today){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    s.streak = (s.lastPracticeDate === y) ? s.streak+1 : 1;
    s.lastPracticeDate = today;
  }
  (wordsUsed||[]).forEach(w=>{ if(!s.wordsLearned.includes(w)) s.wordsLearned.push(w); });
  s.moduleStats[scenario.category] = (s.moduleStats[scenario.category]||0)+1;
  saveState();
}

/* ============================= MOTOR DE VOZ (DEMOSTRATIVO) ============================= */
/* PUNTO DE INTEGRACIÓN: reemplazar por STT/TTS de proveedor (p.ej. Deepgram + ElevenLabs)
   y por el motor conversacional (LLM) en producción. Autenticación, base de datos y pagos
   también quedan marcados como puntos de integración a continuación. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const VoiceEngine = {
  supported: !!SpeechRec && 'speechSynthesis' in window,
  recognizing:false, _rec:null,
  speak(text, rate){
    return new Promise(res=>{
      if(!('speechSynthesis' in window)){ res(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate = rate || 1;
      u.onend = res; u.onerror = res;
      window.speechSynthesis.speak(u);
    });
  },
  stop(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); if(this._rec){ try{this._rec.stop()}catch(e){} } },
  listen(onResult, onEnd){
    if(!SpeechRec){ onEnd && onEnd('unsupported'); return; }
    const rec = new SpeechRec(); this._rec = rec;
    rec.lang='en-US'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
    let finalTranscript = '';
    this.recognizing = true;
    rec.onresult = (e)=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      onResult && onResult(finalTranscript, interim);
    };
    rec.onerror = ()=>{ this.recognizing=false; onEnd && onEnd('error'); };
    rec.onend = ()=>{ this.recognizing=false; onEnd && onEnd('done', finalTranscript); };
    try{ rec.start(); }catch(e){ onEnd && onEnd('error'); }
  }
};

function scoreTranscript(transcript, keywords){
  const t = (transcript||'').toLowerCase();
  if(!t.trim()) return 0;
  let hits = 0;
  keywords.forEach(k=>{ if(t.includes(k.toLowerCase())) hits++; });
  const coverage = keywords.length ? hits/keywords.length : 0.5;
  const lengthScore = Math.min(1, t.split(' ').length/6);
  return Math.round(Math.min(1, coverage*0.7 + lengthScore*0.3)*100)/100;
}

function avgScore(scores){
  const vals = Object.values(scores||{});
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10);
}
function drawProgressChart(sessions){
  const c = document.getElementById('progressChart'); if(!c) return;
  const ctx = c.getContext('2d');
  const w = c.width = c.clientWidth; const h = c.height = 140;
  ctx.clearRect(0,0,w,h);
  const data = sessions.slice(0,8).reverse().map(s=>avgScore(s.scores));
  if(data.length<1){ ctx.fillStyle='#8996A3'; ctx.font='13px Inter'; ctx.fillText('Sin datos todavía — completa una simulación.',10,h/2); return; }
  const max=100, pad=24;
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--green');
  ctx.lineWidth=3; ctx.beginPath();
  data.forEach((v,i)=>{
    const x = pad + i*((w-2*pad)/Math.max(1,data.length-1));
    const y = h-pad - (v/max)*(h-2*pad);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--orange');
  data.forEach((v,i)=>{
    const x = pad + i*((w-2*pad)/Math.max(1,data.length-1));
    const y = h-pad - (v/max)*(h-2*pad);
    ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
  });
}

function simSpeakQuestion(){

  const qd = SIM.scenario.questions[SIM.step] || {en:SIM.scenario.opening};
  document.getElementById('simStatus').textContent = '🔊 Reproduciendo pregunta...';

function evaluateAnswer(transcript){
  const qd = SIM.scenario.questions[SIM.step];
  const sc = scoreTranscript(transcript, qd.keywords);
  SIM.transcripts.push(transcript); SIM.scores.push(sc);
  const fb = document.getElementById('simFeedback');
  const good = sc >= 0.55;
  fb.innerHTML = `<div class="card p-4 mt-2" style="background:${good?'var(--green-bg)':'var(--red-bg)'}">
    <div class="font-bold text-sm mb-1" style="color:${good?'var(--green)':'var(--red)'}">${good?'✅ Buena respuesta':'✏️ Se puede mejorar'}</div>
    ${SIM.mode==='guided' || !good ? `<p class="text-sm mb-1"><b>Respuesta más clara:</b> "${qd.tip}"</p><p class="text-xs opacity-60">Error común a evitar: ${qd.error}</p>`:''}

  document.getElementById('simNext').style.display='inline-flex';
}

function renderResults(){

  renderTopNav('scenarios'); renderBottomNav('scenarios');

  const durationMin = Math.max(1, Math.round((Date.now()-SIM.startedAt)/60000));
  const overall = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100) : 0;
  const metrics = {
    'Comprensión auditiva': clampScore(overall/10 + rnd()),
    'Pronunciación': clampScore(overall/10 + rnd()),
    'Vocabulario': clampScore(overall/10 + rnd()),
    'Gramática': clampScore(overall/10 + rnd()),
    'Claridad': clampScore(overall/10 + rnd()),
    'Fluidez': clampScore(overall/10 + rnd()),
    'Seguridad al responder': clampScore(overall/10 + rnd()),
    'Preparación para la situación': clampScore(overall/10),
  };
  const newWords = scenario.keyVocab.slice(0,5);
  const weakIdx = scores.map((s,i)=>({s,i})).filter(o=>o.s<0.55).map(o=>o.i);

  document.getElementById('app').innerHTML = wrap(`
    <div class="max-w-3xl mx-auto">

          <div class="flex justify-between text-sm font-semibold mb-1"><span>${k}</span><span>${v}/10</span></div>
          <div class="scorebar"><div style="width:${v*10}%"></div></div>

      <div class="grid md:grid-cols-2 gap-4 mb-6">
        <div class="card p-5">
          <h4 class="font-bold mb-2" style="color:var(--green)">✅ Respuestas correctas</h4>
          <ul class="text-sm space-y-1 opacity-80">${scores.map((s,i)=>s>=0.55?`<li>• ${scenario.questions[i].en}</li>`:'').join('') || '<li class="opacity-50">Sigue practicando para sumar aciertos.</li>'}</ul>
        </div>
        <div class="card p-5">
          <h4 class="font-bold mb-2" style="color:var(--red)">✏️ Respuestas a mejorar</h4>
          <ul class="text-sm space-y-1 opacity-80">${weakIdx.map(i=>`<li>• ${scenario.questions[i].en}<br><span class="opacity-50 text-xs">Sugerido: "${scenario.questions[i].tip}"</span></li>`).join('') || '<li class="opacity-50">¡No hubo respuestas débiles esta vez!</li>'}</ul>
        </div>
      </div>
      <div class="card p-5 mb-6">
        <h4 class="font-bold mb-2" style="color:var(--navy)">📚 Vocabulario nuevo de esta práctica</h4>
        <div class="flex flex-wrap gap-2">${newWords.map(w=>`<span class="badge badge-navy">${w}</span>`).join('')}</div>
      </div>
      <div class="card p-5 mb-6" style="background:var(--mist)">
        <h4 class="font-bold mb-1" style="color:var(--navy)">Recomendación para tu siguiente práctica</h4>
        <p class="text-sm opacity-70">${overall>=70?`Buen trabajo. Prueba un escenario de mayor dificultad dentro de ${MODULES.find(m=>m.id===scenario.category).name}.`:`Repite este escenario en modo "Práctica guiada" para reforzar el vocabulario de ${MODULES.find(m=>m.id===scenario.category).name}.`}</p>

function clampScore(v){ return Math.max(1, Math.min(10, Math.round(v))); }

      <div class="badge badge-green mb-3">🗣️ Práctica de pronunciación</div>
      <div class="card p-6">
        <p class="text-sm opacity-60 mb-2">Repite la siguiente frase en voz alta:</p>
        <p class="text-xl font-bold mb-1" style="color:var(--navy)">${item.en}</p>
        <p class="text-xs opacity-50 mb-4">/${item.pron}/</p>
        <button class="btn btn-ghost btn-sm mb-4" data-action="pron-listen">🔊 Escuchar modelo</button>
        <button class="mic-btn" data-action="pron-mic">🎤</button>
        <div id="pronStatus" class="text-sm opacity-60 mt-3">Toca el micrófono y repite la frase</div>
        <div id="pronResult" class="mt-3"></div>
      </div>
      <button class="btn btn-outline mt-5" data-action="pron-next">Siguiente palabra →</button>
    </div>
  `);
}
function levenshtein(a,b){
  a=a.toLowerCase().trim(); b=b.toLowerCase().trim();
  const m=[]; for(let i=0;i<=b.length;i++)m[i]=[i];
  for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)
    m[i][j]=b.charAt(i-1)==a.charAt(j-1)?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
  return m[b.length][a.length];
}

/* ============================= EVENTOS ============================= */
document.addEventListener('click', function(e){
  const navEl = e.target.closest('[data-nav]');
  const anchorEl = e.target.closest('[data-anchor]');
  const actionEl = e.target.closest('[data-action]');
  if(navEl){ go('#/'+navEl.dataset.nav); return; }
  if(anchorEl){ const t=document.getElementById(anchorEl.dataset.anchor); if(t) t.scrollIntoView({behavior:'smooth'}); return; }
  if(!actionEl) return;
  const action = actionEl.dataset.action; const val = actionEl.dataset.val;

  if(action==='play-demo'){
    const lines = JSON.parse(document.getElementById('demoConvo').dataset.lines);
    (async()=>{ for(const l of lines){ if(l.who!=='AI Instructor') await VoiceEngine.speak(l.text,1); } })();
  }
  else if(action==='ob-back'){ onboardStep=Math.max(0,onboardStep-1); renderOnboarding(); }
  else if(action==='ob-next'){
    const qd = ONBOARD_QUESTIONS[onboardStep];
    if(qd.type==='text'){ STATE.user[qd.key] = document.getElementById('obInput').value.trim(); }
    if(qd.type==='choice' && !STATE.user['_'+qd.key+'set']){ /* keep as chosen already */ }
    saveState(); onboardStep++; renderOnboarding();
  }
  else if(action==='ob-choice'){
    const qd = ONBOARD_QUESTIONS[onboardStep];
    STATE.user[qd.key] = qd.key==='level'?val.split(' - ')[0]:val;
    saveState(); renderOnboarding();
  }
  else if(action==='ob-multi'){
    const qd = ONBOARD_QUESTIONS[onboardStep];
    const arr = Array.isArray(STATE.user[qd.key])?STATE.user[qd.key].slice():[];
    const idx = arr.indexOf(val);
    if(idx>-1) arr.splice(idx,1); else arr.push(val);
    STATE.user[qd.key]=arr; saveState(); renderOnboarding();
  }
  else if(action==='ob-diag-mic'){
    const btn = document.getElementById('diagMic'); const status = document.getElementById('diagStatus');
    if(!VoiceEngine.supported){ status.textContent='Micrófono no disponible en este navegador — puedes continuar de todas formas.'; return; }
    btn.classList.add('listening'); status.textContent='Escuchando...';
    VoiceEngine.listen((finalT,interim)=>{ document.getElementById('diagTranscript').textContent = finalT||interim; },
      ()=>{ btn.classList.remove('listening'); status.textContent='Gracias, respuesta registrada.'; });
  }
  else if(action==='ob-finish'){ STATE.onboarded=true; saveState(); go('#/dashboard'); }
  else if(action==='demo-login'){ if(!STATE.user.name) STATE.user.name='Conductor'; STATE.onboarded=true; saveState(); go('#/dashboard'); toast('Sesión iniciada (modo demostración)'); }
  else if(action==='save-profile'){
    STATE.user.name=document.getElementById('pfName').value.trim();
    STATE.user.country=document.getElementById('pfCountry').value.trim();
    STATE.user.dailyMinutes=document.getElementById('pfMinutes').value;
    STATE.user.speed=document.getElementById('pfSpeed').value;
    saveState(); toast('Perfil actualizado'); renderProfile();
  }
  else if(action==='toggle-dark'){ STATE.settings.darkMode=!STATE.settings.darkMode; saveState(); applyDarkMode(); renderProfile(); }
  else if(action==='clear-history'){ if(confirm('¿Eliminar todo tu historial de práctica? Esta acción no se puede deshacer.')){ STATE.progress = defaultState().progress; saveState(); toast('Historial eliminado'); render(); } }
  else if(action==='subscribe'){ toast(val==='free'?'Plan gratuito activado':'La integración de pagos estará disponible próximamente.'); }
  else if(action==='filter-scenario'){ scenarioFilter=val; renderScenarios(); }
  else if(action==='dict-filter'){ dictCat=val; renderDictionary(); }
  else if(action==='dict-listen'){ VoiceEngine.speak(decodeURIComponent(val),0.95); }
  else if(action==='dict-practice'){
    const term = decodeURIComponent(val);
    document.getElementById('dictPracticeModal').innerHTML = `
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" data-action="dict-close">
      <div class="card p-6 max-w-sm w-full text-center" onclick="event.stopPropagation()">
        <h3 class="font-bold mb-2" style="color:var(--navy)">Practica: ${term}</h3>
        <button class="btn btn-ghost btn-sm mb-4" data-action="dict-listen" data-val="${val}">🔊 Escuchar</button><br>
        <button class="mic-btn" data-action="dict-mic" data-val="${val}">🎤</button>
        <div id="dictPronStatus" class="text-sm opacity-60 mt-3">Toca el micrófono y repite la palabra</div>
        <div id="dictPronResult" class="mt-2"></div>
        <button class="btn btn-outline btn-sm mt-4" data-action="dict-close">Cerrar</button>
      </div>
    </div>`;
  }
  else if(action==='dict-close'){ document.getElementById('dictPracticeModal').innerHTML=''; }
  else if(action==='dict-mic'){
    const term = decodeURIComponent(val);
    if(!VoiceEngine.supported){ document.getElementById('dictPronStatus').textContent='Micrófono no disponible en este navegador.'; return; }
    document.getElementById('dictPronStatus').textContent='Escuchando...';
    VoiceEngine.listen((f,i)=>{}, (status,finalT)=>{
      const dist = levenshtein(finalT||'', term);
      const ok = dist <= Math.max(2, Math.round(term.length*0.35));
      document.getElementById('dictPronStatus').textContent = 'Dijiste: "'+(finalT||'—')+'"';
      document.getElementById('dictPronResult').innerHTML = `<span class="badge ${ok?'badge-green':'badge-red'}">${ok?'Pronunciación clara':'Sigue practicando'}</span>`;
    });
  }
  else if(action==='admin-toggle-scenario'){
    const cur = STATE.settings.adminScenarioStatus[val] !== false;
    STATE.settings.adminScenarioStatus[val] = !cur; saveState(); renderAdmin();
  }
  else if(action==='admin-add-word'){
    const en=document.getElementById('admWordEn').value.trim();
    const es=document.getElementById('admWordEs').value.trim();
    const def=document.getElementById('admWordDef').value.trim();
    const cat=document.getElementById('admWordCat').value;
    if(!en||!es){ toast('Escribe al menos la palabra en inglés y su traducción'); return; }
    STATE.settings.adminVocab.push({en,es,def:def||'—',cat,pron:en.toLowerCase(),ex:en});
    saveState(); toast('Palabra agregada al diccionario'); renderAdmin();
  }
  /* ---- simulación ---- */
  else if(action==='sim-mic'){
    if(!SIM) return;
    if(!VoiceEngine.supported){ toast('Usa "Escribir respuesta" en este navegador.'); return; }
    const btn = document.getElementById('simMic'); btn.classList.add('listening');
    document.getElementById('simStatus').textContent='Escuchando...';
    VoiceEngine.listen((f,i)=>{ document.getElementById('simTranscript').textContent = f||i; },
      (status,finalT)=>{ btn.classList.remove('listening'); document.getElementById('simStatus').textContent='Procesando...';
        setTimeout(()=>{ document.getElementById('simStatus').textContent='Respuesta registrada'; evaluateAnswer(finalT||''); },400); });
  }
  else if(action==='sim-type'){
    const txt = prompt('Escribe tu respuesta en inglés:'); if(txt===null) return;
    document.getElementById('simTranscript').textContent = txt;
    evaluateAnswer(txt);
  }
  else if(action==='sim-repeat'){ simSpeakQuestion(); }
  else if(action==='sim-slow'){ SIM.speed = 0.6; simSpeakQuestion(); }
  else if(action==='sim-help'){
    const phrase = HONEST_PHRASES[Math.floor(Math.random()*HONEST_PHRASES.length)];
    toast('Frase útil: "'+phrase.en+'" ('+phrase.es+')');
  }
  else if(action==='sim-es'){ const es=document.getElementById('questionEs'); es.style.display = es.style.display==='none'?'block':'none'; }
  else if(action==='sim-next'){ SIM.step++; renderSimulate(SIM.scenario.id, SIM.mode); }
  else if(action==='sim-end'){ if(confirm('¿Terminar esta simulación y ver tus resultados?')) renderResults(); }
  else if(action==='sim-retry'){ startSimulation(SIM.scenario.id, SIM.mode); renderSimulate(SIM.scenario.id, SIM.mode); }
  /* ---- quick / listening / pronunciation ---- */
  else if(action==='quick-mic'){
    clearInterval(window._quickInterval);
    if(!VoiceEngine.supported){ document.getElementById('quickStatus').textContent='Micrófono no disponible.'; return; }
    document.getElementById('quickStatus').textContent='Escuchando...';
    VoiceEngine.listen((f,i)=>{}, (s,finalT)=>{
      document.getElementById('quickResult').innerHTML = `<p class="text-sm">Dijiste: "${finalT||'—'}"</p>`;
      document.getElementById('quickStatus').textContent='¡Buen intento!';
    });
  }
  else if(action==='quick-next'){ window._quickIdx=(window._quickIdx||0)+1; renderQuick(); }
  else if(action==='listen-speed'){ window._listenSpeed = parseFloat(val); }
  else if(action==='listen-play'){ const bank=SCENARIOS.flatMap(s=>s.questions); const item=bank[window._listenIdx%bank.length]; VoiceEngine.speak(item.en, window._listenSpeed||1); }
  else if(action==='listen-reveal'){ document.getElementById('listenText').style.display='block'; }
  else if(action==='listen-next'){ window._listenIdx=(window._listenIdx||0)+1; renderListening(); }
  else if(action==='pron-listen'){ const item=VOCAB[window._pronIdx%VOCAB.length]; VoiceEngine.speak(item.en, 0.85); }
  else if(action==='pron-mic'){
    const item=VOCAB[window._pronIdx%VOCAB.length];
    if(!VoiceEngine.supported){ document.getElementById('pronStatus').textContent='Micrófono no disponible.'; return; }
    document.getElementById('pronStatus').textContent='Escuchando...';
    VoiceEngine.listen((f,i)=>{}, (s,finalT)=>{
      const dist = levenshtein(finalT||'', item.en);
      const ok = dist <= Math.max(2, Math.round(item.en.length*0.35));
      document.getElementById('pronStatus').textContent = 'Dijiste: "'+(finalT||'—')+'"';
      document.getElementById('pronResult').innerHTML = `<span class="badge ${ok?'badge-green':'badge-red'}">${ok?'Muy clara':'Sigue practicando esta palabra'}</span>`;
    });
  }
  else if(action==='pron-next'){ window._pronIdx=(window._pronIdx||0)+1; renderPronunciation(); }
});
document.addEventListener('input', function(e){
  if(e.target.id==='dictSearch'){ dictQuery = e.target.value; renderDictionary(); }
});

/* ============================= RENDER PRINCIPAL ============================= */
function render(){
  const parts = currentRoute();
  const [page, a, b] = parts;
  window.scrollTo(0,0);
  if(page==='landing') return renderLanding();
  if(page==='login') return renderLogin();
  if(page==='onboarding') return renderOnboarding();
  if(page==='dashboard') return renderDashboard();
  if(page==='modules') return renderModules(a);
  if(page==='scenarios') return renderScenarios();
  if(page==='simulate') return renderSimulate(a);
  if(page==='history') return renderHistory();
  if(page==='dictionary') return renderDictionary();
  if(page==='plan') return renderPlan();
  if(page==='profile') return renderProfile();
  if(page==='subscription') return renderSubscription();
  if(page==='admin') return renderAdmin();
  if(page==='quick') return renderQuick();
  if(page==='listening') return renderListening();
  if(page==='pronunciation') return renderPronunciation();
  return renderLanding();
}
if(!window.location.hash) window.location.hash = STATE.onboarded ? '#/dashboard' : '#/landing';
render();
</script>
